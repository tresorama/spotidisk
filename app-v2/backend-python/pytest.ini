[pytest]
# directory for test discovery
testpaths = core
# pattern for test file discovery
python_files = *.test.py
# import mode (LET PYTHON CORRECTLY IMPORT MODULES named "xxx.test.py")
addopts = --import-mode=importlib
# nam pattrn of test runners
python_classes = Test*
python_functions = test_*
asyncio_debug = true
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
